# ============================================================
# p104-xorg.conf —— 给 P104-100 起一个"压空闲功耗"的 X server
#
# ★ 用途：让卡从 P0 掉到 P8。
#
#   没有 X 的时候，这张卡 0% 利用率也**一直停在 P0、SM 顶 1607 MHz、
#   白烧 22.3~22.6 W**，等多久都不降。起一个最简 X server 让驱动接管
#   显示子系统后，约 15 秒进 P8：139 MHz / 7.8~8.0 W，省 ~14.6 W。
#   停掉 X 会立刻回到 P0 / 22.4 W，可逆。
#
#   ⇒ 这个 X 是"待机省电"用的，**不是为了跑程序**。
#     要看画面/跑 OpenGL 另说（那用 PRIME offload 或别的路）。
#
# ★ 这个文件**不要**放进 /etc/X11/xorg.conf.d/
#
#   实测过：放进去会让 P104 抢到 screen 0（因为它是配置里唯一的 Device），
#   Intel 核显干脆不被加载 ⇒ X11 桌面黑屏（P104 没有物理输出）。
#
#   正确用法是用 -config 显式指定，起一个独立的 X：
#     Xorg :8 -config /etc/X11/p104-xorg.conf
#   或者直接用同目录的 xorg-p104.sh start
#
# ★ 为什么是"无头"配置：
#   P104-100 是 3D controller（PCI class 0302），没有物理输出。
#   必须 AllowEmptyInitialConfiguration，否则驱动报
#   "No devices detected / No screens found" 直接退出。
#   这个无头 screen 对压功耗完全够用。
# ============================================================

# ------------------------------------------------------------
# ServerLayout：隔离输入设备
#
# AutoAddDevices "false" 很关键 —— 否则这个 X server 会去抓键盘鼠标，
# 和当前桌面抢设备（表现为键鼠在两边跳）。
# AutoAddGPU "false" 防止它顺手把 Intel 也接管。
# ------------------------------------------------------------
Section "ServerLayout"
    Identifier     "Layout-P104"
    Option         "AutoAddDevices" "false"
    Option         "AutoAddGPU"     "false"
EndSection

Section "Device"
    Identifier     "NVIDIA P104-100"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BoardName      "P104-100"

    # 只接管这一张卡
    BusID          "PCI:01:00:0"
    Option         "ProbeAllGpus" "false"

    # 无输出设备：必须允许空初始配置，否则驱动报
    #   (EE) NVIDIA(0): No devices detected / No screens found
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "UseDisplayDevice" "none"

    # 矿卡多 VID/DID，EDID 读了没意义
    Option         "UseEDID" "false"
    Option         "NoLogo" "true"
    Option         "HardDPMS" "false"
EndSection

# ------------------------------------------------------------
# 故意不写 Screen 段：Xorg 会按 Device 自动生成默认 Screen，
# 默认 640x480x24。无头场景分辨率无所谓，有这个 screen 驱动才会进 P8。
# ------------------------------------------------------------
